<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none" role="img" aria-label="Ilustrasi buku tulis dan pensil untuk latihan menulis Kiril">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FD"/>
    </linearGradient>
    <linearGradient id="pencilW" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#E09B19"/>
    </linearGradient>
    <linearGradient id="coverW" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0F3F7A"/>
    </linearGradient>
  </defs>

  <circle cx="66" cy="60" r="46" fill="#fff" opacity=".08"/>
  <circle cx="338" cy="212" r="52" fill="#fff" opacity=".07"/>
  <circle cx="330" cy="54" r="4" fill="#FDE68A" opacity=".8"/>
  <circle cx="104" cy="42" r="3" fill="#FDE68A" opacity=".6"/>

  <!-- Buku tulis -->
  <g>
    <rect x="104" y="52" width="196" height="182" rx="20" fill="url(#coverW)"/>
    <rect x="116" y="64" width="172" height="158" rx="14" fill="url(#paper)"/>
    <g stroke="#CBD5E1" stroke-width="1.5" opacity=".8">
      <path d="M136 104h132M136 126h132M136 148h132M136 170h132M136 192h96"/>
    </g>
    <!-- Spiral -->
    <g fill="#FDE68A">
      <rect x="98" y="78" width="18" height="7" rx="3.5"/>
      <rect x="98" y="106" width="18" height="7" rx="3.5"/>
      <rect x="98" y="134" width="18" height="7" rx="3.5"/>
      <rect x="98" y="162" width="18" height="7" rx="3.5"/>
      <rect x="98" y="190" width="18" height="7" rx="3.5"/>
    </g>
    <text x="198" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0F3F7A">Привет</text>
    <text x="198" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">privet · halo</text>
    <text x="198" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#E09B19">Я Ж Д Б</text>
  </g>

  <!-- Pensil -->
  <g transform="rotate(34 300 150)">
    <rect x="286" y="54" width="30" height="150" rx="9" fill="url(#pencilW)"/>
    <rect x="286" y="54" width="30" height="18" rx="9" fill="#F87171"/>
    <path d="M286 204h30l-15 24z" fill="#FDE68A"/>
    <path d="M301 228l-6-13h12z" fill="#0F172A"/>
  </g>

  <!-- Chip huruf -->
  <g>
    <rect x="42" y="180" width="56" height="56" rx="14" fill="#fff" opacity=".95" transform="rotate(-8 70 208)"/>
    <text x="70" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0F3F7A" transform="rotate(-8 70 208)">Я</text>
  </g>
  <g>
    <rect x="322" y="70" width="52" height="52" rx="13" fill="#FBBF24" transform="rotate(9 348 96)"/>
    <text x="348" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#3B2500" transform="rotate(9 348 96)">Ж</text>
  </g>

  <path d="M344 176l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FDE68A"/>
</svg>
